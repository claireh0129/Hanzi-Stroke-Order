<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢字筆順動畫</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-tc-webfont@1.7.0/style.css">
<style>
:root{--bg1:#eef4fb;--bg2:#d4e4f6;--card:#ffffff;--ink:#17375e;--sub:#5e7aa0;--blue:#2f6bb0;--blue-d:#1f4f8f;--blue-l:#eaf2fb;--line:#cbdcee;--kai:'LXGW WenKai TC','KaiTi','DFKai-SB',serif;--stroke:#2f6bb0;--radical:#d1495b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans TC',system-ui,"Microsoft JhengHei",sans-serif;color:var(--ink);
  background:radial-gradient(circle at 50% -10%,#f3f8fe,#dce9f8 60%,#cadef3);min-height:100%}
/* ===== 登入 ===== */
#gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
#gate.active{display:flex}
.gate-card{width:min(460px,92vw);background:var(--card);border:1.5px solid var(--line);border-radius:22px;
  box-shadow:0 14px 38px rgba(30,70,130,.18);padding:38px 34px 30px;text-align:center}
.gate-logo{font-size:52px;line-height:1}
.gate-card h1{font-family:var(--kai);font-size:32px;margin:10px 0 3px;color:var(--ink)}
.gate-card .sub{font-size:14px;color:var(--sub);margin:0 0 24px}
.gate-card .fld{text-align:left;margin-bottom:16px}
.gate-card label{display:block;font-size:14px;font-weight:700;color:#3f5e86;margin-bottom:6px}
.gate-card input{width:100%;font:18px/1.4 inherit;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:#fbfdff}
.gate-card input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,107,176,.15)}
.btn-go{margin-top:8px;width:100%;border:none;border-radius:14px;padding:15px;font:800 19px var(--kai);color:#fff;
  background:linear-gradient(180deg,#4c90d8,#2f6bb0);box-shadow:0 5px 0 #1f4f8f;cursor:pointer}
.btn-go:active{transform:translateY(3px);box-shadow:0 2px 0 #1f4f8f}
.gate-err{color:#c0392b;font-size:14px;min-height:20px;margin-top:10px}
.gate-foot{font-size:12px;color:#8aa0bd;margin-top:18px;line-height:1.5}
/* ===== 主畫面 ===== */
#main{display:none}
#main.active{display:block}
.topbar{position:sticky;top:0;z-index:5;background:rgba(238,244,251,.97);backdrop-filter:blur(5px);
  border-bottom:1.5px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--kai);font-weight:800;font-size:24px;white-space:nowrap;color:var(--ink)}
.who{font-size:14px;color:var(--sub);margin-left:auto;white-space:nowrap}
.search{flex-basis:100%;display:flex;gap:12px;align-items:center;max-width:1120px;margin:2px auto 0}
.search input{flex:1;font:17px inherit;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fbfdff}
.search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,107,176,.12)}
.search .count{font-size:14px;color:var(--sub);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;padding:22px 26px 40px;max-width:1120px;margin:0 auto}
.tile{aspect-ratio:1/1;background:var(--card);border:1.5px solid var(--line);border-radius:15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 2px 0 #d7e4f3;transition:transform .08s,box-shadow .08s,border-color .08s}
.tile:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(47,107,176,.18)}
.tile:active{transform:translateY(2px);box-shadow:0 0 0 #d7e4f3}
.tile .c{font-family:var(--kai);font-size:46px;line-height:1;color:var(--ink)}
.tile .p{font-size:13px;color:var(--sub);margin-top:5px}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:50px 0;font-size:16px}
/* ===== 動畫彈窗 ===== */
#modal{position:fixed;inset:0;z-index:20;background:rgba(20,45,85,.5);display:none;align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex}
.mcard{width:min(480px,94vw);background:var(--card);border:1.5px solid var(--line);border-radius:22px;
  box-shadow:0 18px 50px rgba(20,55,110,.32);padding:22px 24px 20px;text-align:center;position:relative}
.mclose{position:absolute;right:14px;top:12px;border:none;background:var(--blue-l);color:var(--blue);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.mclose:hover{background:#d8e8f8}
.mhead{font-family:var(--kai);font-size:28px;margin:2px 0 2px;color:var(--ink)}
.mpy{font-size:16px;color:var(--sub);margin-bottom:12px}
.animbox{position:relative;width:min(380px,74vw);height:min(380px,74vw);margin:0 auto;background:#fbfdff;border:1.5px solid var(--line);border-radius:16px}
.animbox .gl{position:absolute}
.animbox .gl.v{left:50%;top:5%;bottom:5%;border-left:1.5px dashed #d7e6f6}
.animbox .gl.h{top:50%;left:5%;right:5%;border-top:1.5px dashed #d7e6f6}
.animbox .gl.d1{left:7%;right:7%;top:50%;border-top:1px dashed #e6f0fa;transform:rotate(45deg)}
.animbox .gl.d2{left:7%;right:7%;top:50%;border-top:1px dashed #e6f0fa;transform:rotate(-45deg)}
#animTarget{position:absolute;inset:0;z-index:2}
.mctrl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:16px}
.mctrl button{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 16px;font:700 15px inherit;color:#3f5e86;cursor:pointer}
.mctrl button:hover{border-color:var(--blue)}
.mctrl button.pri{background:linear-gradient(180deg,#4c90d8,#2f6bb0);color:#fff;border-color:#2a60a0}
.mctrl .seg{display:inline-flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden}
.mctrl .seg button{border:none;border-radius:0;border-right:1px solid var(--line);padding:10px 15px}
.mctrl .seg button:last-child{border-right:none}
.mctrl .seg button.on{background:var(--blue);color:#fff}
.mctrl label{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#3f5e86}
.mnote{font-size:12px;color:#8aa0bd;margin-top:12px}
</style>
</head>
<body>

<!-- 登入 -->
<section id="gate" class="active">
  <div class="gate-card">
    <div class="gate-logo">🖌️</div>
    <h1>漢字筆順動畫</h1>
    <p class="sub">教育部標準筆順</p>
    <div class="fld"><label>學號 Student ID</label><input id="inId" type="text" autocomplete="off" placeholder="請輸入學號"></div>
    <div class="fld"><label>姓名 Name</label><input id="inName" type="text" autocomplete="off" placeholder="請輸入姓名"></div>
    <button class="btn-go" onclick="doLogin()">進入 ▸</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-foot">共 165 字。點選任一字即可觀看教育部標準筆順動畫。</div>
  </div>
</section>

<!-- 主畫面 -->
<section id="main">
  <div class="topbar">
    <div class="brand">漢字筆順動畫</div>
    <div class="who" id="who"></div>
    <div class="search">
      <input id="q" type="text" placeholder="搜尋漢字或拼音…（例如：我 或 wo）" oninput="renderGrid()">
      <span class="count" id="cnt"></span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<!-- 動畫彈窗 -->
<div id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mcard">
    <button class="mclose" onclick="closeModal()">×</button>
    <div class="mhead" id="mChar">字</div>
    <div class="mpy" id="mPy"></div>
    <div class="animbox">
      <i class="gl v"></i><i class="gl h"></i><i class="gl d1"></i><i class="gl d2"></i>
      <div id="animTarget"></div>
    </div>
    <div class="mctrl">
      <button class="pri" onclick="replay()">▶ 重播</button>
      <button onclick="nextStroke()">下一畫</button>
      <span class="seg" id="spd">
        <button data-s="0.5" class="on" onclick="setSpeed(0.5,this)">慢</button>
        <button data-s="1" onclick="setSpeed(1,this)">中</button>
        <button data-s="2" onclick="setSpeed(2,this)">快</button>
      </span>
      <label><input type="checkbox" id="loopChk" onchange="toggleLoop()"> 循環</label>
    </div>
    <div class="mnote">筆順資料來源：教育部《國字標準字體筆順學習網》</div>
  </div>
</div>

<script>
/* ==== 使用記錄 ====
   如需收集「誰、看了哪些字、停留多久」，把下方 LOG_ENDPOINT 換成你的
   Google Apps Script 網頁應用程式網址（與書寫遊戲相同做法，但請用專屬網址，避免兩組資料混在一起）。
   留空則不記錄，頁面仍可正常使用。 */
const LOG_ENDPOINT = 'https://wvofqyuaudjtodalhojj.supabase.co/rest/v1/logs';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2b2ZxeXVhdWRqdG9kYWxob2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MTMxMzYsImV4cCI6MjEwNzQ4OTEzNn0.KO5zuYhqEHF6An2q8iaTD7jXh3TsvXNG4nsSiucFCJE';
const _q=[];
let _sending=false;
function logRec(rec,useKeepalive){
  if(!LOG_ENDPOINT) return;
  _q.push(rec);
  send(useKeepalive);
}
function send(useKeepalive){
  if(_sending || !_q.length) return;
  _sending=true;
  const rec=_q[0];
  const opt={method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({activity:'動畫_'+(rec.類型||'log'),cls:rec.學號||'',name:rec.姓名||'',payload:rec})};
  if(useKeepalive) opt.keepalive=true;
  fetch(LOG_ENDPOINT,opt)
    .then(r=>{ if(r&&r.ok){ _q.shift(); _sending=false; send(); } else { _sending=false; setTimeout(send,5000); } })
    .catch(()=>{ _sending=false; setTimeout(send,5000); });
}
function nowStr(){ const d=new Date(),p=n=>(''+n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }

/* ==== 字庫（含拼音）==== */
const CHARS = [["的", "de"], ["是", "shì"], ["一", "yī"], ["個", "ge"], ["我", "wǒ"], ["有", "yǒu"], ["不", "bù"], ["也", "yě"], ["們", "men"], ["你", "nǐ"], ["都", "dōu"], ["說", "shuō"], ["要", "yào"], ["人", "rén"], ["對", "duì"], ["很", "hěn"], ["來", "lái"], ["和", "hé"], ["她", "tā"], ["好", "hǎo"], ["以", "yǐ"], ["年", "nián"], ["到", "dào"], ["沒", "méi"], ["大", "dà"], ["去", "qù"], ["他", "tā"], ["做", "zuò"], ["看", "kàn"], ["兩", "liǎng"], ["後", "hòu"], ["什", "shén"], ["麼", "me"], ["時", "shí"], ["候", "hòu"], ["台", "tái"], ["臺", "tái"], ["多", "duō"], ["用", "yòng"], ["想", "xiǎng"], ["現", "xiàn"], ["天", "tiān"], ["前", "qián"], ["可", "kě"], ["能", "néng"], ["月", "yuè"], ["小", "xiǎo"], ["知", "zhī"], ["道", "dào"], ["家", "jiā"], ["嗎", "ma"], ["問", "wèn"], ["新", "xīn"], ["給", "gěi"], ["呢", "ne"], ["三", "sān"], ["位", "wèi"], ["吃", "chī"], ["元", "yuán"], ["工", "gōng"], ["日", "rì"], ["子", "zi"], ["歲", "suì"], ["灣", "wān"], ["太", "tài"], ["東", "dōng"], ["西", "xī"], ["媽", "mā"], ["老", "lǎo"], ["師", "shī"], ["怎", "zěn"], ["幾", "jǐ"], ["高", "gāo"], ["妳", "nǐ"], ["學", "xué"], ["生", "shēng"], ["美", "měi"], ["國", "guó"], ["今", "jīn"], ["本", "běn"], ["中", "zhōng"], ["水", "shuǐ"], ["書", "shū"], ["吧", "ba"], ["愛", "ài"], ["帶", "dài"], ["起", "qǐ"], ["請", "qǐng"], ["走", "zǒu"], ["二", "èr"], ["喜", "xǐ"], ["歡", "huān"], ["外", "wài"], ["點", "diǎn"], ["話", "huà"], ["四", "sì"], ["昨", "zuó"], ["校", "xiào"], ["找", "zhǎo"], ["叫", "jiào"], ["分", "fēn"], ["爸", "bà"], ["朋", "péng"], ["友", "yǒu"], ["寫", "xiě"], ["聽", "tīng"], ["買", "mǎi"], ["五", "wǔ"], ["先", "xiān"], ["半", "bàn"], ["錢", "qián"], ["您", "nín"], ["車", "chē"], ["誰", "shéi"], ["打", "dǎ"], ["拿", "ná"], ["路", "lù"], ["快", "kuài"], ["哪", "nǎ"], ["十", "shí"], ["謝", "xiè"], ["坐", "zuò"], ["少", "shǎo"], ["久", "jiǔ"], ["字", "zì"], ["六", "liù"], ["喝", "hē"], ["裡", "lǐ"], ["裏", "lǐ"], ["兒", "ér"], ["同", "tóng"], ["早", "zǎo"], ["女", "nǚ"], ["七", "qī"], ["晚", "wǎn"], ["上", "shàng"], ["八", "bā"], ["英", "yīng"], ["下", "xià"], ["午", "wǔ"], ["茶", "chá"], ["姐", "jiě"], ["電", "diàn"], ["百", "bǎi"], ["手", "shǒu"], ["機", "jī"], ["名", "míng"], ["號", "hào"], ["哥", "gē"], ["法", "fǎ"], ["千", "qiān"], ["九", "jiǔ"], ["咖", "kā"], ["啡", "fēi"], ["妹", "mèi"], ["飯", "fàn"], ["弟", "dì"], ["明", "míng"], ["覺", "jué"], ["再", "zài"], ["見", "jiàn"], ["姓", "xìng"], ["星", "xīng"], ["期", "qí"], ["安", "ān"]];
const PY = {}; CHARS.forEach(([c,p])=>PY[c]=p||'');
const TONE='āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ', PLAIN='aaaaeeeeiiiioooouuuuuuuu';
function stripTone(s){ return (s||'').toLowerCase().replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/g,m=>PLAIN[TONE.indexOf(m)]); }

let student={id:'',name:''};
function doLogin(){
  const id=document.getElementById('inId').value.trim();
  const name=document.getElementById('inName').value.trim();
  if(!id||!name){ document.getElementById('gateErr').textContent='請輸入學號與姓名'; return; }
  student={id,name,loginTime:nowStr()};
  document.getElementById('who').textContent=id+'　'+name;
  document.getElementById('gate').classList.remove('active');
  document.getElementById('main').classList.add('active');
  renderGrid();
  logRec({類型:'登入',學號:id,姓名:name,時間:nowStr()});
}

function renderGrid(){
  const qv=(document.getElementById('q').value||'').trim().toLowerCase();
  const qp=stripTone(qv);
  const box=document.getElementById('grid'); box.innerHTML='';
  let n=0;
  CHARS.forEach(([c,p])=>{
    if(qv){ const hit=c.includes(qv)||(p||'').toLowerCase().includes(qv)||stripTone(p).includes(qp); if(!hit)return; }
    n++;
    const t=document.createElement('div'); t.className='tile'; t.onclick=()=>openChar(c);
    t.innerHTML='<div class="c">'+c+'</div><div class="p">'+(p||'')+'</div>';
    box.appendChild(t);
  });
  if(!n){ box.innerHTML='<div class="empty">找不到符合的字</div>'; }
  document.getElementById('cnt').textContent=n+' 字';
}

/* ==== 動畫 ==== */
let writer=null, curChar='', curSpeed=0.5, curStroke=0, looping=false, viewStart=0, strokeN=0, vReplay=0, vNext=0;
function animSize(){ const b=document.querySelector('.animbox'); const s=b?Math.min(b.clientWidth,b.clientHeight):0; return s>40?s:360; }
const DUTI=new Set([...'一我不也人來年大兩用天月小三元工日子太東西幾生本中水二五半車十少久兒女七上八下午手千九弟再見']);
function makeWriter(play){
  const t=document.getElementById('animTarget'); t.innerHTML=''; curStroke=0;
  writer=HanziWriter.create('animTarget',curChar,{
    width:animSize(),height:animSize(),padding:16,
    showCharacter:false,showOutline:true,outlineColor:'#dbe8f6',
    strokeColor:'#2f6bb0',radicalColor:(typeof DUTI!=='undefined'&&DUTI.has(curChar)?'#2f6bb0':'#d1495b'),
    strokeAnimationSpeed:curSpeed,delayBetweenStrokes:650,delayBetweenLoops:1400,
    charDataLoader:(c,cb,onErr)=>getCharData(c).then(cb).catch(e=>{onErr&&onErr(e);})
  });
  getCharData(curChar).then(d=>{ strokeN=(d&&d.strokes)?d.strokes.length:0; }).catch(()=>{});
  if(play){ if(looping) writer.loopCharacterAnimation(); else writer.animateCharacter(); }
}
function openChar(ch){
  curChar=ch;
  document.getElementById('mChar').textContent=ch;
  document.getElementById('mPy').textContent=PY[ch]||'';
  document.getElementById('modal').classList.add('open');
  looping=document.getElementById('loopChk').checked;
  // 先讓彈窗完成版面排版再建立並播放，確保尺寸正確、動畫一定自動播放
  requestAnimationFrame(()=>{ setTimeout(()=>makeWriter(true), 40); });
  viewStart=Date.now(); vReplay=0; vNext=0;
}
function closeModal(){
  if(curChar){ const sec=Math.round((Date.now()-viewStart)/1000);
    logRec({類型:'瀏覽筆順',登入時間:student.loginTime||'',學號:student.id,姓名:student.name,觀看目標生字:curChar,拼音:PY[curChar]||'',停留秒數:sec,點選重播次數:vReplay,點選下一畫次數:vNext,登出時間:nowStr()}); }
  document.getElementById('modal').classList.remove('open');
  if(writer){ try{writer.cancelQuiz&&writer.cancelQuiz();}catch(e){} }
  document.getElementById('animTarget').innerHTML='';
  curChar='';
}
function replay(){ vReplay++; looping=document.getElementById('loopChk').checked; makeWriter(true); }
function nextStroke(){
  if(!writer)return;
  vNext++;
  if(strokeN && curStroke>=strokeN){ makeWriter(false); }
  try{ writer.animateStroke(curStroke); curStroke++; }catch(e){}
}
function setSpeed(s,btn){ curSpeed=s;
  document.querySelectorAll('#spd button').forEach(b=>b.classList.remove('on')); btn.classList.add('on');
  if(curChar) makeWriter(true);
}
function toggleLoop(){ looping=document.getElementById('loopChk').checked; if(curChar) makeWriter(true); }

document.getElementById('inName').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('inId').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('inName').focus();});
// 若關閉分頁／切走時仍開著某字的動畫，補記這次瀏覽
function flushOpenChar(){
  if(!curChar) return;
  const sec=Math.round((Date.now()-viewStart)/1000);
  logRec({類型:'瀏覽筆順',登入時間:student.loginTime||'',學號:student.id,姓名:student.name,觀看目標生字:curChar,拼音:PY[curChar]||'',停留秒數:sec,點選重播次數:vReplay,點選下一畫次數:vNext,登出時間:nowStr()}, true);
  curChar='';
}
window.addEventListener('pagehide',flushOpenChar);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushOpenChar(); });
</script>
